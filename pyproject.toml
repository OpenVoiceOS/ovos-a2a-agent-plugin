[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-a2a-solver-plugin"
dynamic = ["version"]
description = "Consume external A2A agents as OVOS persona solvers"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "OpenVoiceOS", email = "openvoiceos@gmail.com"}]
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ovos-plugin-manager>=2.3.0a1,<3.0.0",
    "httpx>=0.25.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-a2a-agent-plugin"
Repository = "https://github.com/OpenVoiceOS/ovos-a2a-agent-plugin"
"Bug Tracker" = "https://github.com/OpenVoiceOS/ovos-a2a-agent-plugin/issues"

[project.optional-dependencies]
test = [
    "ovoscope>=0.13.1",
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
    "pytest-cov",
    # local-mock A2A server used by test/end2end/test_e2e_a2a_solver.py
    "respx",
    "fastapi",
    "uvicorn",
    "httpx>=0.25.0,<1.0",
    # ovos-persona-pipeline-plugin ships inside ovos-persona; the locale data
    # required to load the pipeline is only present in the wheel from 0.9.0a3 on
    "ovos-persona>=0.9.0a3",
]

[tool.pytest.ini_options]
timeout = 600

[project.entry-points."opm.agents.chat"]
ovos-a2a-solver = "ovos_a2a_solver.engine:A2AChatEngine"

[tool.setuptools.dynamic]
version = {attr = "ovos_a2a_solver.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_a2a_solver*"]
